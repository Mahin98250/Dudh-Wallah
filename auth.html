<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#175a3c"><title>Doodhwala — Sign in</title><link rel="icon" href="/Dudh-Wallah/assets/logo.svg"><link rel="stylesheet" href="/Dudh-Wallah/styles.css"><link rel="stylesheet" href="/Dudh-Wallah/auth.css"></head><body class="auth-page"><main class="auth-shell"><a class="auth-back" href="/Dudh-Wallah/">← Back to Doodhwala</a><section class="auth-card"><div class="auth-brand"><img src="/Dudh-Wallah/assets/logo.svg" alt=""><div><b>Doodhwala</b><small>Local milk, nearby.</small></div></div><span class="eyebrow">YOUR DOODHWALA ACCOUNT</span><h1 id="authTitle">Welcome back.</h1><p id="authIntro">Sign in to save addresses, place orders and manage your milk deliveries.</p><div class="auth-tabs"><button class="active" data-mode="signin">Sign in</button><button data-mode="signup">Create account</button></div><form id="authForm"><label>Full name <input id="fullName" autocomplete="name" placeholder="Your name"></label><label>Email <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required></label><label>Password <input id="password" type="password" autocomplete="current-password" minlength="8" placeholder="At least 8 characters" required></label><button class="primary auth-submit" id="submitAuth" type="submit">Sign in →</button></form><div id="authMessage" class="auth-message"></div><div class="auth-demo"><b>Backend-aware</b><span>The app continues in demo mode until Supabase credentials are configured.</span></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.min.js"></script><script src="/Dudh-Wallah/supabase-config.js"></script><script src="/Dudh-Wallah/supabase-client.js"></script><script src="/Dudh-Wallah/auth.js"></script></body></html>
