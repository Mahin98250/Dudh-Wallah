name: Static validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          set -e
          for file in app.js auth.js checkout.js checkout-10x.js provider.js provider-10x.js supabase-client.js supabase-config.js sw.js orders.js plans.js admin.js admin-intelligence.js store.js product.js customer-nav.js customer-10x.js customer-market-10x.js location.js provider-location.js resilience.js; do
            node --check "$file"
          done
      - name: Validate site asset contracts
        run: node scripts/validate-site.mjs
      - name: Reject accidental domain-root paths
        run: |
          set -e
          matches=$(grep -RInE 'href="/|src="/|location\.href="/|register\("/|start_url":"/' --include='*.html' --include='*.js' --include='*.webmanifest' . | grep -v '/Dudh-Wallah/' || true)
          if [ -n "$matches" ]; then
            echo "$matches"
            echo "Found an absolute path that is not rooted at the Doodhwala GitHub Pages project."
            exit 1
          fi
